services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pims
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pims"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      PIMS_DATABASE_URL: postgresql+psycopg://postgres:password@db:5432/pims
      PIMS_CRYPTO_PROVIDER: ${PIMS_CRYPTO_PROVIDER:-YAHOO}
      PIMS_LLM_BASE_URL: ${PIMS_LLM_BASE_URL:-}
      PIMS_LLM_API_KEY: ${PIMS_LLM_API_KEY:-}
      PIMS_LLM_MODEL: ${PIMS_LLM_MODEL:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      PIMS_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  pgdata:

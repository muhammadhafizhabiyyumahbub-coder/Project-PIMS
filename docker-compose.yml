services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-pims}
    # DB stays on the compose network only; not published to the host (Q1).
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pims}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      PIMS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-pims}
      PIMS_CRYPTO_PROVIDER: ${PIMS_CRYPTO_PROVIDER:-YAHOO}
      PIMS_LLM_BASE_URL: ${PIMS_LLM_BASE_URL:-}
      PIMS_LLM_API_KEY: ${PIMS_LLM_API_KEY:-}
      PIMS_LLM_MODEL: ${PIMS_LLM_MODEL:-}
    # Host-local only (127.0.0.1); not reachable from the LAN (Q1).
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      PIMS_API_URL: http://backend:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend

volumes:
  pgdata: